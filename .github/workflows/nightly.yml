name: forecast-desk-loop

# Times are UTC. US market open 09:30 ET => 13:30/14:30 UTC (DST-dependent).
# premarket runs ~08:45 ET (forecasts + triage); postclose runs ~16:45 ET
# (grade the forecast that just settled + post-mortem, writing desk memory).
# We accept the DST half-hour drift (logged, not corrected).
on:
  schedule:
    - cron: "45 12 * * 1-5"    # premarket ~08:45 ET (EDT) Mon-Fri
    - cron: "45 20 * * 1-5"    # postclose ~16:45 ET (EDT) Mon-Fri
  workflow_dispatch:
    inputs:
      mode:
        description: premarket | postclose
        default: premarket
      asof:
        description: "session date (YYYY-MM-DD); blank = today / last settled"
        default: ""

concurrency:
  group: forecast-desk-loop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vendor Kronos
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git vendor_kronos

      - name: Cache Kronos weights
        uses: actions/cache@v4
        with:
          path: hf_cache
          key: kronos-weights-v1

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "asof=${{ github.event.inputs.asof }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 12 * * 1-5" ]; then
            echo "mode=premarket" >> "$GITHUB_OUTPUT"
          else
            echo "mode=postclose" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          KRONOS_DEVICE: cpu
        run: |
          ASOF="${{ steps.mode.outputs.asof }}"
          if [ -n "$ASOF" ]; then
            python -m src.run_daily ${{ steps.mode.outputs.mode }} --asof "$ASOF"
          else
            python -m src.run_daily ${{ steps.mode.outputs.mode }} \
              --asof "$(python -c 'import datetime as d; print(d.date.today())')"
          fi

      - name: Commit the log + memory
        run: |
          git config user.name  "forecast-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add log/ memory/ || true
          git diff --cached --quiet || git commit -m "loop ${{ steps.mode.outputs.mode }} $(date -u +%FT%TZ)"
          git push
