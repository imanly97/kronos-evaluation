name: nightly-narrative-arb

# Times are UTC. US market open 09:30 ET => 13:30/14:30 UTC (DST-dependent).
# We run the signal job ~08:45 ET and the evaluate job ~09:45 ET next morning,
# and just accept the DST half-hour drift (logged, not corrected).
on:
  schedule:
    - cron: "45 12 * * 2-6"   # signal:   ~08:45 ET (EDT) Tue-Sat
    - cron: "45 13 * * 2-6"   # evaluate: ~09:45 ET (EDT) Tue-Sat
  workflow_dispatch:
    inputs:
      mode:
        description: signal | evaluate
        default: signal

concurrency:
  group: narb-nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vendor Kronos
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git vendor_kronos

      - name: Cache Kronos weights
        uses: actions/cache@v4
        with:
          path: hf_cache
          key: kronos-weights-v1

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 12 * * 2-6" ]; then
            echo "mode=signal" >> "$GITHUB_OUTPUT"
          else
            echo "mode=evaluate" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          KRONOS_DEVICE: cpu
        run: python -m src.run_nightly ${{ steps.mode.outputs.mode }}

      - name: Commit the log
        run: |
          git config user.name  "narb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add log/ case_studies/headlines/ || true
          git diff --cached --quiet || git commit -m "nightly ${{ steps.mode.outputs.mode }} $(date -u +%FT%TZ)"
          git push
